[project]
name = "cognitive-resonance"
version = "0.0.1"
description = "Errors in antiphase: when a pair of minds behaves like a resonant circuit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_resonance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
